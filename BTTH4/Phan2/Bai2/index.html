<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Đặt Hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .error {
      color: red;
      font-size: 0.9rem;
    }
    .valid {
      color: green;
    }
    #summary {
      display: none;
      margin-top: 20px;
      padding: 10px;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <h2>Form Đặt Hàng</h2>
  <form id="orderForm">
    <!-- Tên sản phẩm -->
    <div class="mb-3">
      <label for="product" class="form-label">Tên sản phẩm</label>
      <select id="product" class="form-select">
        <option value="">-- Chọn sản phẩm --</option>
        <option value="Áo">Áo</option>
        <option value="Quần">Quần</option>
        <option value="Giày">Giày</option>
      </select>
      <div id="productError" class="error"></div>
    </div>

    <!-- Số lượng -->
    <div class="mb-3">
      <label for="quantity" class="form-label">Số lượng</label>
      <input type="number" id="quantity" class="form-control" min="1" max="99">
      <div id="quantityError" class="error"></div>
    </div>

    <!-- Ngày giao hàng -->
    <div class="mb-3">
      <label for="deliveryDate" class="form-label">Ngày giao hàng</label>
      <input type="date" id="deliveryDate" class="form-control">
      <div id="dateError" class="error"></div>
    </div>

    <!-- Địa chỉ giao -->
    <div class="mb-3">
      <label for="address" class="form-label">Địa chỉ giao</label>
      <input type="text" id="address" class="form-control">
      <div id="addressError" class="error"></div>
    </div>

    <!-- Ghi chú -->
    <div class="mb-3">
      <label for="note" class="form-label">Ghi chú</label>
      <textarea id="note" class="form-control" maxlength="200"></textarea>
      <div id="noteCounter" class="form-text">0/200</div>
      <div id="noteError" class="error"></div>
    </div>

    <!-- Phương thức thanh toán -->
    <div class="mb-3">
      <label class="form-label">Phương thức thanh toán</label>
      <div>
        <input type="radio" id="cod" name="payment" value="COD">
        <label for="cod">COD</label>
        <input type="radio" id="bank" name="payment" value="Chuyển khoản">
        <label for="bank">Chuyển khoản</label>
        <input type="radio" id="e-wallet" name="payment" value="Ví điện tử">
        <label for="e-wallet">Ví điện tử</label>
      </div>
      <div id="paymentError" class="error"></div>
    </div>

    <!-- Tổng tiền -->
    <div class="mb-3">
      <label class="form-label">Tổng tiền</label>
      <input type="text" id="totalPrice" class="form-control" disabled>
    </div>

    <!-- Xác nhận -->
    <button type="submit" class="btn btn-primary">Đặt hàng</button>
  </form>

  <!-- Tóm tắt đơn hàng -->
  <div id="summary">
    <h4>Tóm tắt đơn hàng</h4>
    <p><strong>Sản phẩm:</strong> <span id="summaryProduct"></span></p>
    <p><strong>Số lượng:</strong> <span id="summaryQuantity"></span></p>
    <p><strong>Tổng tiền:</strong> <span id="summaryTotal"></span></p>
    <p><strong>Ngày giao:</strong> <span id="summaryDate"></span></p>
    <button id="confirmBtn" class="btn btn-success">Xác nhận</button>
    <button id="cancelBtn" class="btn btn-danger">Hủy</button>
  </div>
</div>

<script>
  const prices = { "Áo": 150000, "Quần": 200000, "Giày": 300000 };
  const form = document.getElementById("orderForm");
  const productSelect = document.getElementById("product");
  const quantityInput = document.getElementById("quantity");
  const deliveryDateInput = document.getElementById("deliveryDate");
  const addressInput = document.getElementById("address");
  const noteTextarea = document.getElementById("note");
  const totalPriceInput = document.getElementById("totalPrice");
  const summaryDiv = document.getElementById("summary");
  const summaryProduct = document.getElementById("summaryProduct");
  const summaryQuantity = document.getElementById("summaryQuantity");
  const summaryTotal = document.getElementById("summaryTotal");
  const summaryDate = document.getElementById("summaryDate");
  const confirmBtn = document.getElementById("confirmBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  // Kiểm tra ngày giao hàng không quá 30 ngày và không phải ngày trong quá khứ
  const validateDeliveryDate = () => {
    const today = new Date();
    const selectedDate = new Date(deliveryDateInput.value);
    const maxDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 30);
    return selectedDate >= today && selectedDate <= maxDate;
  };

  // Cập nhật tổng tiền
  const updateTotalPrice = () => {
    const product = productSelect.value;
    const quantity = Number(quantityInput.value);
    if (product && quantity > 0 && quantity <= 99) {
      const total = prices[product] * quantity;
      totalPriceInput.value = total.toLocaleString("vi-VN");
    }
  };

  // Đếm ký tự trong ghi chú
  const updateNoteCounter = () => {
    const noteLength = noteTextarea.value.length;
    const maxLength = 200;
    document.getElementById("noteCounter").textContent = `${noteLength}/${maxLength}`;
    if (noteLength > maxLength) {
      document.getElementById("noteCounter").style.color = "red";
      document.getElementById("noteError").textContent = "Ghi chú không được quá 200 ký tự.";
    } else {
      document.getElementById("noteCounter").style.color = "black";
      document.getElementById("noteError").textContent = "";
    }
  };

  // Hiển thị tóm tắt đơn hàng
  const showSummary = () => {
    const product = productSelect.value;
    const quantity = Number(quantityInput.value);
    const total = prices[product] * quantity;
    const deliveryDate = deliveryDateInput.value;
    summaryProduct.textContent = product;
    summaryQuantity.textContent = quantity;
    summaryTotal.textContent = total.toLocaleString("vi-VN");
    summaryDate.textContent = deliveryDate;
    summaryDiv.style.display = "block";
  };

  // Kiểm tra tính hợp lệ của form
  const validateForm = () => {
    let isValid = true;

    // Kiểm tra tên sản phẩm
    if (!productSelect.value || productSelect.value === "") {
      document.getElementById("productError").textContent = "Vui lòng chọn sản phẩm.";
      isValid = false;
    } else {
      document.getElementById("productError").textContent = "";
    }

    // Kiểm tra số lượng
    const quantity = Number(quantityInput.value);
    if (quantity < 1 || quantity > 99) {
      document.getElementById("quantityError").textContent = "Số lượng phải từ 1 đến 99.";
      isValid = false;
    } else {
      document.getElementById("quantityError").textContent = "";
    }

    // Kiểm tra ngày giao hàng
    if (!validateDeliveryDate()) {
      document.getElementById("dateError").textContent = "Ngày giao hàng phải là ngày hôm nay hoặc trong vòng 30 ngày tới.";
      isValid = false;
    } else {
      document.getElementById("dateError").textContent = "";
    }

    // Kiểm tra địa chỉ giao
    if (addressInput.value.trim().length < 10) {
      document.getElementById("addressError").textContent = "Địa chỉ giao phải có ít nhất 10 ký tự.";
      isValid = false;
    } else {
      document.getElementById("addressError").textContent = "";
    }

    // Kiểm tra ghi chú
    if (noteTextarea.value.trim().length > 200) {
      document.getElementById("noteError").textContent = "Ghi chú không được quá 200 ký tự.";
      isValid = false;
    } else {
      document.getElementById("noteError").textContent = "";
    }

    // Kiểm tra phương thức thanh toán
    if (!document.querySelector('input[name="payment"]:checked')) {
      document.getElementById("paymentError").textContent = "Vui lòng chọn phương thức thanh toán.";
      isValid = false;
    } else {
      document.getElementById("paymentError").textContent = "";
    }

    return isValid;
  };

  // Event Listeners
  productSelect.addEventListener("change", updateTotalPrice);
  quantityInput.addEventListener("input", updateTotalPrice);
  noteTextarea.addEventListener("input", updateNoteCounter);
  deliveryDateInput.addEventListener("change", validateDeliveryDate);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (validateForm()) {
      showSummary();
    }
  });

  confirmBtn.addEventListener("click", () => {
    alert("Đặt hàng thành công!");
    form.reset();
    summaryDiv.style.display = "none";
  });

  cancelBtn.addEventListener("click", () => {
    summaryDiv.style.display = "none";
  });
</script>

</body>
</html>
