<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý điểm sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .low-score {
            background-color: yellow;
        }
        .arrow {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Quản lý điểm sinh viên</h2>

        <!-- Tìm kiếm -->
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo tên">
        </div>

        <!-- Lọc theo xếp loại -->
        <div class="mb-3">
            <select id="filterSelect" class="form-select">
                <option value="all">Tất cả</option>
                <option value="Giỏi">Giỏi</option>
                <option value="Khá">Khá</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Yếu">Yếu</option>
            </select>
        </div>

        <!-- Thêm sinh viên -->
        <div class="mb-3">
            <label for="name" class="form-label">Họ tên</label>
            <input type="text" class="form-control" id="name" placeholder="Nhập họ tên">
        </div>
        <div class="mb-3">
            <label for="score" class="form-label">Điểm</label>
            <input type="number" class="form-control" id="score" placeholder="Nhập điểm (0-10)" min="0" max="10">
        </div>
        <button class="btn btn-primary" onclick="addStudent()">Thêm</button>

        <!-- Bảng danh sách sinh viên -->
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th>
                        Điểm 
                        <span id="sortArrow" class="arrow">▲</span>
                    </th>
                    <th>Xếp loại</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="studentList">
                <!-- Dữ liệu sẽ được thêm vào đây -->
            </tbody>
        </table>

        <!-- Thống kê tổng số sinh viên và điểm trung bình -->
        <div id="statistics" class="mt-3">
            <strong>Tổng số sinh viên: </strong><span id="totalStudents">0</span><br>
            <strong>Điểm trung bình: </strong><span id="averageScore">0</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let students = []; // Mảng lưu danh sách sinh viên
        let filteredStudents = []; // Mảng lọc theo tìm kiếm, xếp loại và sắp xếp
        let sortDirection = 'asc'; // Chế độ sắp xếp (asc hoặc desc)

        // Hàm tính xếp loại
        function getGrade(score) {
            if (score >= 8.5) {
                return "Giỏi";
            } else if (score >= 7.0) {
                return "Khá";
            } else if (score >= 5.0) {
                return "Trung bình";
            } else {
                return "Yếu";
            }
        }

        // Hàm thêm sinh viên vào mảng và bảng
        function addStudent() {
            const name = document.getElementById("name").value.trim();
            const score = parseFloat(document.getElementById("score").value);

            // Kiểm tra điều kiện nhập liệu
            if (name === "" || isNaN(score) || score < 0 || score > 10) {
                alert("Vui lòng nhập đầy đủ thông tin và điểm hợp lệ (0-10).");
                return;
            }

            // Tạo đối tượng sinh viên
            const student = {
                name: name,
                score: score,
                grade: getGrade(score)
            };

            // Thêm sinh viên vào mảng
            students.push(student);

            // Vẽ lại bảng
            applyFilters();

            // Xóa dữ liệu nhập và đưa con trỏ về ô họ tên
            document.getElementById("name").value = "";
            document.getElementById("score").value = "";
            document.getElementById("name").focus();
        }

        // Hàm render lại bảng
        function renderTable() {
            const tableBody = document.getElementById("studentList");
            tableBody.innerHTML = ""; // Xóa dữ liệu cũ trong bảng

            if (filteredStudents.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='5' class='text-center'>Không có kết quả</td></tr>";
                return;
            }

            filteredStudents.forEach((student, index) => {
                const row = tableBody.insertRow();
                
                // STT
                row.insertCell(0).textContent = index + 1;

                // Họ tên
                row.insertCell(1).textContent = student.name;

                // Điểm
                row.insertCell(2).textContent = student.score;

                // Xếp loại
                row.insertCell(3).textContent = student.grade;

                // Thao tác (Xóa)
                const cell = row.insertCell(4);
                const deleteButton = document.createElement("button");
                deleteButton.classList.add("btn", "btn-danger", "btn-sm");
                deleteButton.textContent = "Xóa";
                deleteButton.setAttribute("data-index", index);
                deleteButton.onclick = function() {
                    deleteStudent(index);
                };
                cell.appendChild(deleteButton);

                // Tô màu nền nếu điểm dưới 5
                if (student.score < 5.0) {
                    row.classList.add("low-score");
                }
            });

            // Cập nhật thống kê
            updateStatistics();
        }

        // Hàm xóa sinh viên khỏi mảng
        function deleteStudent(index) {
            // Xóa sinh viên trong mảng
            students.splice(index, 1);
            
            // Vẽ lại bảng
            applyFilters();
        }

        // Hàm cập nhật thống kê tổng số sinh viên và điểm trung bình
        function updateStatistics() {
            const totalStudents = filteredStudents.length;
            const totalScore = filteredStudents.reduce((sum, student) => sum + student.score, 0);
            const averageScore = totalStudents > 0 ? (totalScore / totalStudents).toFixed(2) : 0;
            
            document.getElementById("totalStudents").textContent = totalStudents;
            document.getElementById("averageScore").textContent = averageScore;
        }

        // Hàm áp dụng bộ lọc và sắp xếp
        function applyFilters() {
            const searchKeyword = document.getElementById("searchInput").value.toLowerCase();
            const selectedGrade = document.getElementById("filterSelect").value;

            // Lọc theo tìm kiếm
            filteredStudents = students.filter(student => student.name.toLowerCase().includes(searchKeyword));

            // Lọc theo xếp loại
            if (selectedGrade !== 'all') {
                filteredStudents = filteredStudents.filter(student => student.grade === selectedGrade);
            }

            // Sắp xếp theo điểm
            filteredStudents.sort((a, b) => {
                if (sortDirection === 'asc') {
                    return a.score - b.score;
                } else {
                    return b.score - a.score;
                }
            });

            // Vẽ lại bảng
            renderTable();
        }

        // Thêm sự kiện cho tìm kiếm
        document.getElementById("searchInput").addEventListener("input", applyFilters);

        // Thêm sự kiện cho lọc xếp loại
        document.getElementById("filterSelect").addEventListener("change", applyFilters);

        // Thêm sự kiện cho sắp xếp theo điểm
        document.getElementById("sortArrow").addEventListener("click", function() {
            sortDirection = (sortDirection === 'asc') ? 'desc' : 'asc';
            document.getElementById("sortArrow").textContent = (sortDirection === 'asc') ? '▲' : '▼';
            applyFilters();
        });
    </script>
</body>
</html>
